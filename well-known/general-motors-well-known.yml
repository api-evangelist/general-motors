specification: API Evangelist Well-Known Probe
specificationVersion: '0.1'
provider: General Motors
providerId: general-motors
generated: '2026-09-12'
method: probed
source: live HTTPS probes of every host this record knows (registrable domain + www, the
  developer portal host, and both GM API gateway hosts)
description: >-
  General Motors serves no /.well-known document on any host we can reach. Recorded as an
  honest absence: no WellKnown or SecurityTxt pointer is wired in apis.yml, because every
  path either 404s or returns the developer portal's single-page-app shell.
note: >-
  developer.gm.com is a client-rendered single-page app whose static host answers HTTP 200
  with the same 5,366-byte React shell for EVERY path, including paths that do not exist.
  A 200 on that host is therefore NOT evidence of a document — html_shell: true marks each
  one. The two GM API gateways (api.gm.com and api.onstarfleetintelligence.com, both Azure
  API Management) answer a clean JSON 404.
