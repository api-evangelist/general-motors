description: >-
  General Motors publishes no first-party SDK or client library on any public package
  registry. Every OnStar / GM client library on npm and PyPI is a community project and
  says so in its own description. GM's GitHub organization (47 public repos) is almost
  entirely upstream mirrors and forks (Apache Kafka, Hadoop, Angular, Suricata) with no
  first-party API client among them.
