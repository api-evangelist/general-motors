description: >-
  General Motors publishes no plans and no prices for its API and data services. Access to
  the OnStar / GM Envolve commercial APIs is negotiated — the developer portal's own copy
  says the APIs are "Available to approved customers and partners", and the only onboarding
  path offered to a visitor is a Contact Us form.
