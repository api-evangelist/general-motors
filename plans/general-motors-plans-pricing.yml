notes: >-
  Upgraded 2026-09-12 from a generated placeholder that invented a single "Partner /
  Developer Program" tier. GM publishes no such tier publicly, so the entry was removed and
  replaced with an honest zero. Re-probed the portal: the pricing-bearing pages, if they
  exist, live under /docs/*, which the portal's router guards with requireCommercialAPIAccess.
