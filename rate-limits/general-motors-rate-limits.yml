- url: https://developer.gm.com/v1/apis
  status: 403
  note: no rate-limit headers on the response; bearer token required
- url: https://api.gm.com/
  status: 404
  note: GM's Azure API Management gateway; JSON 404 with no rate-limit headers
- url: https://api.onstarfleetintelligence.com/
