description: >-
  General Motors publishes no rate limits for its API and data services, and no rate-limit
  response headers can be observed because no GM API endpoint answers a request
  unauthenticated. Any limits that exist are stated in the commercial agreement, which is
  not public.
limit_count: 0
limits: []
headers: []
responseCodes: {}
notes: >-
  Upgraded 2026-09-12 from a generated placeholder whose single entry read
  "limit: see partner agreement" — a description of the absence, not a published limit, and
  it was being counted as one. Replaced with an honest zero. The documentation that would
  carry limits sits under developer.gm.com/docs/*, which the portal router guards with
  requireCommercialAPIAccess; the portal backend returns 403 to anonymous callers, so no
  X-RateLimit-*/RateLimit-*/Retry-After header could be observed either.
